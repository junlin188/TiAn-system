name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-gd

      - name: Lint PHP files
        run: find public -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    name: Sync release
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    env:
      ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
      ALIYUN_PORT: ${{ secrets.ALIYUN_PORT || '22' }}
      ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
      ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      ALIYUN_TARGET_DIR: ${{ secrets.ALIYUN_TARGET_DIR || '/var/www/tian-system' }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          test -n "$ALIYUN_HOST"
          test -n "$ALIYUN_USER"
          test -n "$ALIYUN_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          ssh-keyscan -p "$ALIYUN_PORT" "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -i ~/.ssh/aliyun_deploy_key -p "$ALIYUN_PORT" "$ALIYUN_USER@$ALIYUN_HOST" \
            "mkdir -p '$ALIYUN_TARGET_DIR/storage/uploads' '$ALIYUN_TARGET_DIR/storage/captcha' && chmod ug+rwX '$ALIYUN_TARGET_DIR/storage' '$ALIYUN_TARGET_DIR/storage/uploads' '$ALIYUN_TARGET_DIR/storage/captcha'"

      - name: Rsync application
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/aliyun_deploy_key -p $ALIYUN_PORT" \
            --exclude='.git/' \
            --exclude='.agents/' \
            --exclude='storage/app.sqlite' \
            --exclude='storage/uploads/***' \
            --exclude='storage/captcha/***' \
            ./ "$ALIYUN_USER@$ALIYUN_HOST:$ALIYUN_TARGET_DIR/"

      - name: Fix writable storage permissions
        run: |
          ssh -i ~/.ssh/aliyun_deploy_key -p "$ALIYUN_PORT" "$ALIYUN_USER@$ALIYUN_HOST" \
            "chmod +x '$ALIYUN_TARGET_DIR'/deploy/*.sh 2>/dev/null || true; chmod ug+rwX '$ALIYUN_TARGET_DIR/storage' '$ALIYUN_TARGET_DIR/storage/uploads' '$ALIYUN_TARGET_DIR/storage/captcha'"

      - name: Apply upload size limits
        run: |
          ssh -i ~/.ssh/aliyun_deploy_key -p "$ALIYUN_PORT" "$ALIYUN_USER@$ALIYUN_HOST" "
            set -e
            if [ \"\$(id -u)\" -eq 0 ]; then
              SUDO=''
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              SUDO='sudo'
            else
              echo 'The deploy user needs root or passwordless sudo to update Nginx upload limits.' >&2
              exit 1
            fi
            \$SUDO sed -i 's/client_max_body_size[[:space:]][^;]*;/client_max_body_size 520m;/' /etc/nginx/sites-available/tian-system
            \$SUDO nginx -t
            \$SUDO systemctl reload nginx
          "

      - name: Health check
        if: env.PUBLIC_URL != ''
        run: curl --fail --location --max-time 20 "$PUBLIC_URL"
